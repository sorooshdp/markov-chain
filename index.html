<!doctype html>

<html lang="en">
  <head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markov Chain Generator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <h1 class="main-header">Markov Chain Generator</h1>
    </header>

    <main>
      <section id="model-selection">
        <h2>Select Model</h2>
        <div id="select-model"></div>
      </section>

      <section id="current-model">
        <h2>Current Model</h2>
        <div id="current-model-info">
          No model selected
        </div>
      </section>

      <section id="generator">

        <form id="markov-form">
          <div class="form-row">
            <input type="text" placeholder="Enter a starting sentence..." name="user-input" id="user-input"></input>
            <button type="submit">Generate</button>
          </div>

          <div class="form-row controls">
            <label for="temperature" title="Lower values are predictable, higher values are more chaotic.">
            Temperature (<span id="temp-display">1.0</span>)
            </label>
            <input type="range" id="temperature" min="0.1" max="3" step="0.1" value="1.0">
          </div>
        </form>
      </section>

      <section>
        <h2>Output</h2>
        <div id="output"></div>
      </section>

      <section id="model-preview">
        <h2>Model Preview</h2>
        <div id="model-entries" class="model-entries"></div>
        <button id="show-more" type="button" hidden>Show 50 more</button>
      </section>
    </main>
  </body>
  <script type="module" src="dist/browser.js"></script>
</html>
